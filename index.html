<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PROT · clasificado 🔒</title>
<style>
  :root { --bg: #0a0a0f; --card: #14141c; --accent: #ff5722; --text: #f5f5f7; --muted: #9a9aa5; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; align-items: center; justify-content: center; }
  #gate { text-align: center; max-width: 420px; width: 100%; padding: 24px; }
  .lock { width: 72px; height: 72px; margin: 0 auto 24px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 32px; box-shadow: 0 0 50px #ff572244; }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: .5px; }
  .msg { color: var(--muted); font-size: 14.5px; line-height: 1.6; margin-top: 12px; }
  .msg b { color: var(--accent); }
  form { margin-top: 26px; display: flex; flex-direction: column; gap: 12px; }
  input { background: var(--card); border: 1px solid #ffffff14; border-radius: 12px; padding: 14px; color: var(--text); font-size: 15px; text-align: center; outline: none; transition: border-color .2s; }
  input:focus { border-color: var(--accent); }
  button { background: var(--accent); color: #fff; border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; transition: .2s; }
  button:hover { filter: brightness(1.1); }
  #error { color: #ff5252; font-size: 13px; margin-top: 12px; min-height: 18px; }
  #app { display: none; position: fixed; inset: 0; width: 100%; height: 100%; border: none; }
</style>
</head>
<body>
  <div id="gate">
    <div class="lock">🔒</div>
    <h1>Contenido clasificado</h1>
    <p class="msg">No podés ver el contenido hasta no meter la <b>contraseña correcta</b> wawa</p>
    <form id="form" autocomplete="off">
      <input id="pass" type="password" placeholder="contraseña" />
      <button type="submit">Entrar</button>
    </form>
    <div id="error"></div>
  </div>
  <iframe id="app" title="PROT"></iframe>
  <script>
    const PASS = "protnescl";
    const form = document.getElementById("form");
    const input = document.getElementById("pass");
    const error = document.getElementById("error");
    const gate = document.getElementById("gate");
    const app = document.getElementById("app");
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (input.value === PASS) {
        error.textContent = "";
        gate.style.display = "none";
        app.style.display = "block";
        app.src = "app.html";
      } else {
        error.textContent = "❌ contraseña incorrecta, no podés ver el contenido :c";
        input.value = "";
        input.focus();
      }
    });
  </script>
</body>
</html>
